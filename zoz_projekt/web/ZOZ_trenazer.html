<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style><title>ZOZ Trenažér</title></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f4f2; --panel:#ffffff; --panel2:#e9ebe7; --line:#cfd4cc; --line2:#e2e5df;
  --ink:#1b2320; --ink2:#4c5751; --ink3:#7a857f;
  --accent:#1f4e79; --accent-ink:#ffffff; --accent-soft:#dfe9f3;
  --ok:#1f7a3a; --ok-soft:#dcefe1; --bad:#b3261e; --bad-soft:#f7dcda; --warn:#a05e00; --warn-soft:#f8e8c9;
  --shadow:0 1px 2px rgba(20,30,25,.08),0 6px 18px rgba(20,30,25,.06);
  --r:10px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a18; --panel:#1e2522; --panel2:#262e2a; --line:#3a453f; --line2:#2e3733;
    --ink:#e8ece9; --ink2:#b4bdb8; --ink3:#7f8a84;
    --accent:#7fb3e6; --accent-ink:#0f1a26; --accent-soft:#233648;
    --ok:#5fcf7f; --ok-soft:#1d3a27; --bad:#f28b82; --bad-soft:#4a2320; --warn:#f0b64a; --warn-soft:#42320f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#151a18; --panel:#1e2522; --panel2:#262e2a; --line:#3a453f; --line2:#2e3733;
  --ink:#e8ece9; --ink2:#b4bdb8; --ink3:#7f8a84;
  --accent:#7fb3e6; --accent-ink:#0f1a26; --accent-soft:#233648;
  --ok:#5fcf7f; --ok-soft:#1d3a27; --bad:#f28b82; --bad-soft:#4a2320; --warn:#f0b64a; --warn-soft:#42320f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;height:auto}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
.mono{font-family:var(--mono)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:18px;font-weight:700;letter-spacing:.01em}
.brand .sub{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{border:1px solid transparent;background:transparent;padding:7px 12px;border-radius:8px;font-weight:500;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab:hover:not([aria-selected="true"]){background:var(--panel2)}

main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
.view[hidden]{display:none}

/* controls */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search],.toolbar select,.field select,.field input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.toolbar input[type=search]{flex:1 1 220px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.count{font-family:var(--mono);font-size:12px;color:var(--ink3)}

/* question cards */
.qlist{display:flex;flex-direction:column;gap:10px}
.q{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow)}
.q-head{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;cursor:pointer;width:100%;text-align:left;background:none;border:0;border-radius:var(--r)}
.q-num{font-family:var(--mono);font-size:13px;color:var(--ink3);min-width:34px;padding-top:2px}
.q-text{flex:1;font-weight:500}
.q-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--ink2);font-family:var(--mono);letter-spacing:.01em}
.chip.tema{background:var(--accent-soft);color:var(--accent)}
.chip.j-vysoká{background:var(--ok-soft);color:var(--ok)}
.chip.j-střední{background:var(--warn-soft);color:var(--warn)}
.chip.j-nízká{background:var(--bad-soft);color:var(--bad)}
.q-body{padding:0 14px 14px 60px;border-top:1px dashed var(--line2)}
.q-body[hidden]{display:none}
@media (max-width:600px){.q-body{padding-left:14px}}
.ans{margin-top:12px;padding:12px 14px;border-left:3px solid var(--ok);background:var(--ok-soft);border-radius:0 8px 8px 0}
.ans b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ok);margin-bottom:4px}
.src{margin-top:10px;font-family:var(--mono);font-size:13px;color:var(--ink2)}
.src span{display:inline-block;margin-right:10px}
.full{margin-top:10px}
.full summary{cursor:pointer;font-weight:500;color:var(--accent);font-size:14px}
.full pre{white-space:pre-wrap;font-family:var(--sans);font-size:13.5px;line-height:1.55;background:var(--panel2);padding:12px 14px;border-radius:8px;margin:8px 0 0;color:var(--ink)}
.note{margin-top:10px;font-size:13px;color:var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:8px}
.qimg{margin-top:12px;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:6px;display:inline-block;max-width:100%}
.distr{margin-top:10px;font-size:13px;color:var(--ink3)}
.distr li{margin:2px 0}
.stat-inline{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-top:8px}

/* flash cards */
.card{background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:22px 22px 18px;max-width:760px;margin:0 auto}
.card .q-num{margin-bottom:6px}
.card .qtext{font-size:19px;font-weight:600;line-height:1.35}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;justify-content:space-between;align-items:center}
.card-actions .grp{display:flex;gap:8px;flex-wrap:wrap}
.progress{height:4px;background:var(--panel2);border-radius:2px;margin:0 auto 14px;max-width:760px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}

/* test setup */
.setup{background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:22px;max-width:760px;margin:0 auto}
.setup h2{font-size:20px;margin-bottom:6px}
.setup p{margin:0 0 16px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-family:var(--mono);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.setup-actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}

/* test run */
.run-head{display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:0 auto 10px;font-family:var(--mono);font-size:13px;color:var(--ink2)}
.timer{font-size:18px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;width:100%}
.opt:hover{background:var(--panel2)}
.opt .k{font-family:var(--mono);font-weight:600;color:var(--accent);min-width:18px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.feedback{margin-top:12px}

/* results */
.score{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px 18px;min-width:140px;flex:1 1 140px;box-shadow:var(--shadow)}
.tile .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-top:4px}
.tile.ok .v{color:var(--ok)}.tile.bad .v{color:var(--bad)}
.res-q{border-left:3px solid var(--line);padding-left:12px;margin:10px 0}
.res-q.ok{border-color:var(--ok)}.res-q.bad{border-color:var(--bad)}
.res-q .t{font-weight:500}
.res-q .a{font-size:13.5px;color:var(--ink2);margin-top:3px}
.res-q .a.wrong{color:var(--bad);text-decoration:line-through}
.res-q .a.right{color:var(--ok)}
table.hist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.hist th,table.hist td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2)}
table.hist th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.tablewrap{overflow-x:auto}
.section{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.section h2{font-size:16px;margin-bottom:10px}
.empty{color:var(--ink3);font-style:italic}
.weak{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.weak:last-child{border-bottom:0}
.bar{height:6px;background:var(--panel2);border-radius:3px;width:120px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bad)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){.progress i{transition:width .25s}}
</style>

<div class="top"><div class="top-in">
  <div class="brand"><h1>ZOZ Trenažér</h1><span class="sub" id="brandSub">strojvedoucí ČD · prosinec 2026</span></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="prehled" aria-selected="true">Přehled</button>
    <button class="tab" role="tab" data-view="karty" aria-selected="false">Kartičky</button>
    <button class="tab" role="tab" data-view="test" aria-selected="false">Test</button>
    <button class="tab" role="tab" data-view="vysledky" aria-selected="false">Výsledky</button>
  </div>
</div></div>

<main>
<!-- PŘEHLED -->
<section class="view" id="view-prehled">
  <div class="toolbar">
    <input type="search" id="q-search" placeholder="Hledat v otázkách, odpovědích, článcích… (např. „40 km/h“, „čl. 138“)">
    <select id="f-tema"><option value="">Všechna témata</option></select>
    <select id="f-predpis"><option value="">Všechny předpisy</option></select>
    <select id="f-jistota"><option value="">Jistota: vše</option><option value="vysoká">vysoká</option><option value="střední">střední</option><option value="nízká">nízká</option></select>
    <button class="btn small" id="btn-expand">Rozbalit vše</button>
    <span class="count" id="q-count"></span>
  </div>
  <div class="qlist" id="qlist"></div>
</section>

<!-- KARTIČKY -->
<section class="view" id="view-karty" hidden>
  <div class="toolbar">
    <select id="k-tema"><option value="">Všechna témata</option></select>
    <select id="k-predpis"><option value="">Všechny předpisy</option></select>
    <label class="check"><input type="checkbox" id="k-shuffle" checked> náhodně</label>
    <label class="check"><input type="checkbox" id="k-weak"> jen chybované</label>
    <button class="btn small" id="k-restart">Znovu od začátku</button>
    <span class="count" id="k-count"></span>
  </div>
  <div class="progress"><i id="k-prog"></i></div>
  <div class="card" id="k-card"></div>
</section>

<!-- TEST -->
<section class="view" id="view-test" hidden>
  <div id="t-setup" class="setup">
    <h2>Nový test</h2>
    <p>Otázky se losují náhodně, možnosti A/B/C se míchají. Výsledky se ukládají v tomto prohlížeči.</p>
    <div class="grid">
      <div class="field"><label>Počet otázek</label>
        <div class="seg" id="t-n"><button aria-pressed="false" data-v="10">10</button><button aria-pressed="true" data-v="20">20</button><button aria-pressed="false" data-v="30">30</button><button aria-pressed="false" data-v="50">50</button><button aria-pressed="false" data-v="all">vše</button></div></div>
      <div class="field"><label>Časový limit</label>
        <div class="seg" id="t-time"><button aria-pressed="true" data-v="0">bez limitu</button><button aria-pressed="false" data-v="5">5 min</button><button aria-pressed="false" data-v="10">10 min</button><button aria-pressed="false" data-v="15">15 min</button><button aria-pressed="false" data-v="30">30 min</button></div></div>
      <div class="field"><label>Téma</label><select id="t-tema"><option value="">Všechna témata</option></select></div>
      <div class="field"><label>Předpis</label><select id="t-predpis"><option value="">Všechny předpisy</option></select></div>
    </div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:16px">
      <label class="check"><input type="checkbox" id="t-feedback" checked> ukázat správnou odpověď hned po volbě</label>
      <label class="check"><input type="checkbox" id="t-weak"> jen otázky, ve kterých jsem chyboval</label>
    </div>
    <div class="setup-actions"><button class="btn primary" id="t-start">Spustit test</button><span class="count" id="t-avail"></span></div>
  </div>

  <div id="t-run" hidden>
    <div class="run-head"><span id="t-pos"></span><span class="timer" id="t-timer"></span><button class="btn small" id="t-abort">Ukončit</button></div>
    <div class="progress"><i id="t-prog"></i></div>
    <div class="card" id="t-card"></div>
  </div>

  <div id="t-result" hidden></div>
</section>

<!-- VÝSLEDKY -->
<section class="view" id="view-vysledky" hidden>
  <div class="score" id="v-tiles"></div>
  <div class="section"><h2>Slabá místa</h2><div id="v-weak"></div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary small" id="v-weaktest">Test z chybovaných otázek</button><button class="btn small" id="v-reset">Smazat historii</button></div></div>
  <div class="section"><h2>Historie testů</h2><div class="tablewrap" id="v-hist"></div></div>
</section>
</main>

<script>
const DATA = [{"n": 1, "otazka": "Vlak zastavil před oddílovým návěstidlem AB s návěstí „Stůj“. V následujícím traťovém oddílu je výhybka odbočující ze širé tratě. Za jakých podmínek a jakým způsobem může vlak pokračovat v jízdě?", "obrazky": ["img/q001_1.png"], "tema": "Návěsti", "predpis": "SŽ D1", "zdroje": [{"predpis": "SŽ D1", "clanek": "čl. 108 odst. (4)"}, {"predpis": "SŽ D1", "clanek": "čl. 108 odst. (5)"}, {"predpis": "SŽ D1", "clanek": "čl. 108 odst. (1)"}], "odpoved": "Vlak smí pokračovat za návěstidlo jen na pokyn výpravčího přední stanice (popř. prostřednictvím výpravčího zadní stanice); strojvedoucí se mu ohlásí po 5 minutách.", "plne_zneni": "SŽ D1 čl. 108 odst. (1): Nejzávažnější návěstí na oddílovém návěstidle AB s označovacími pásy s červenými a bílými pruhy je návěst Stůj a má absolutní význam návěsti Stůj.\n\nSŽ D1 čl. 108 odst. (4): Je-li na oddílovém návěstidle AB s označovacím pásem s červenými a bílými pruhy návěst Stůj, musí strojvedoucí vlaku před tímto oddílovým návěstidlem zastavit. Pokračovat za úroveň tohoto návěstidla může na pokyn výpravčího přední stanice (popř. i prostřednictvím výpravčího zadní stanice).\n\nSŽ D1 čl. 108 odst. (5): Strojvedoucí se po zastavení před návěstí Stůj oddílového návěstidla AB s označovacím pásem s červenými a bílými pruhy ohlásí po uplynutí 5 minut výpravčímu přední stanice. Je-li platné oddílové návěstidlo AB s označovacím pásem s červenými a bílými pruhy poškozené, ohlásí se strojvedoucí výpravčímu přední stanice ihned po zastavení vlaku u tohoto oddílového návěstidla. Není-li možné dorozumění s výpravčím přední stanice, ale strojvedoucí má spojení telekomunikačním zařízením s výpravčím zadní stanice, může další jízdu sjednat prostřednictvím výpravčího zadní stanice.", "distraktory": ["Vlak smí pokračovat za návěstidlo jen na pokyn výpravčího přední stanice (popř. prostřednictvím výpravčího zadní stanice); strojvedoucí se mu ohlásí ihned po zastavení.", "Vlak smí po zastavení pokračovat bez svolení výpravčího podle rozhledových poměrů nejvýše 40 km/h až k následujícímu hlavnímu návěstidlu; návěst Stůj je zde permisivní."], "jistota": "vysoká", "poznamka": ""}, {"n": 2, "otazka": "Strojvedoucímu se nepodařilo provést zkoušku spojení kódovaným hlášením „D“ u rádiovníku s návěstí „Přepněte kanálovou skupinu - 65“. Jaký bude jeho další postup?", "obrazky": [], "tema": "GSM-R a rádio", "predpis": "SŽ Z11", "zdroje": [{"predpis": "SŽ Z11", "clanek": "čl. 32 odst. (4)"}, {"predpis": "SŽ Z11", "clanek": "čl. 32 odst. (2)"}, {"predpis": "SŽ Z11", "clanek": "čl. 32 odst. (3)"}], "odpoved": "Naváže hlasové spojení s výpravčím (dispečerem) rádiového úseku a tím provede zkoušku spojení; opakuje-li se nemožnost zkoušky „D“, jedná se o poruchu.", "plne_zneni": "SŽ Z11 čl. 32 odst. (2): Zkoušku spojení VR provádí strojvedoucí příslušného HDV odesláním kódovaného hlášení „D“ v těchto případech: a) při vzniku vlaku/PMD […]; b) při každé změně čísla vlaku nebo změně rozlišovacího čísla […]; c) na základě návěsti radiovníku.\n\nSŽ Z11 čl. 32 odst. (3): Zkoušku spojení VR provádí strojvedoucí s výpravčím (dispečerem), v jehož rádiovém úseku se nalézá, nebo do kterého bude vjíždět. Provedení zkoušky spojení se nezapisuje, registrace je vedena automaticky na příslušném záznamovém zařízení.\n\nSŽ Z11 čl. 32 odst. (4): Zkouška spojení VR se provádí jednotně a postup provedení je uveden v Příloze E. Nelze-li provést zkoušku spojení kódovaným hlášením „D“, naváže strojvedoucí hlasové spojení s výpravčím (dispečerem), a tím provede zkoušku spojení. Jestliže se nemožnost provedení zkoušky spojení kódovaným hlášením „D“ opakuje, jedná se o poruchu.", "distraktory": ["Naváže hlasové spojení s výpravčím (dispečerem) rádiového úseku a tím provede zkoušku spojení; opakuje-li se nemožnost zkoušky „D“, vlak nesmí pokračovat v jízdě.", "Zopakuje zkoušku kódovaným hlášením „D“ ještě dvakrát; nezdaří-li se ani napotřetí, ponechá nastavenou původní kanálovou skupinu a jedná se o poruchu."], "jistota": "vysoká", "poznamka": ""}, {"n": 3, "otazka": "Volací čísla pro adresné zkrácené volby v systému GSM-R strojvedoucí nalezne:", "obrazky": [], "tema": "GSM-R a rádio", "predpis": "Provozní řád GSM-R", "zdroje": [{"predpis": "Provozní řád GSM-R", "clanek": "kap. 9.2.4"}, {"predpis": "Provozní řád GSM-R", "clanek": "Příloha B"}, {"predpis": "SŽ Z11", "clanek": "čl. 48 odst. (1)"}, {"predpis": "SŽ Z11", "clanek": "čl. 44 odst. (2) c)"}], "odpoved": "V Příloze B Provozního řádu GSM-R CZ na Portálu provozování dráhy, a to do doby uvedení kontaktů zaměstnanců řízení provozu v TTP.", "plne_zneni": "Provozní řád GSM-R kap. 9.2.4: Adresné zkrácené volby platné pro specifická rádiová spojení jsou uvedeny v Příloze B. Tato příloha je platná do doby uvedení kontaktů zaměstnanců řízení provozu pro příslušná telekomunikační zařízení v TTP (v nové samostatné tabulce pro příslušnou trať – „spojení se zaměstnanci řízení provozu“). Po dobu platnosti přílohy B je povinnost strojvedoucích uvedené adresné ZV v příslušné oblasti (obvodu) pro spojení s příslušným pracovištěm řízení provozu používat.\n\nProvozní řád GSM-R Příloha B: […] Dílčí zkrácené volby „1331 až 1360“ lze použít na spojení již z hranice obvodu celého železničního uzlu (úseku trati DOZ). […] Po dobu platnosti této přílohy dle čl. 9.2.4 pro příslušnou trať (tratě) je samostatný seznam níže uvedených adresných ZV k dispozici na Portálu provozování dráhy ve společné složce s tímto PŘ.\n\nSŽ Z11 čl. 48 odst. (1): Adresná volba jednotlivých účastníků systému GSM-R CZ je prováděna podle údajů uvedených v dokumentu Telefonní seznam GSM-R CZ, který je zveřejněn na Portálu provozování dráhy SŽ. […]\n\nSŽ Z11 čl. 44 odst. (2) c): Adresování v závislosti na poloze umožňuje adresné směrování odchozích hovorů […]. Jedná se o volbu pro volání provozního dispečera (zkrácená volba 1200) nebo výpravčího (zkrácená volba 1300) nebo elektrodispečera (zkrácená volba 1400). V případě potřeby jsou v požadovaných oblastech definované také tzv. dílčí (adresné) zkrácené volby výpravčích (např. 1331 až 1350), případně dalších specifických účastníků sítě.", "distraktory": ["V Příloze B předpisu SŽ Z11 na Portálu provozování dráhy, a to do doby uvedení kontaktů zaměstnanců řízení provozu v TTP.", "Ve staničním řádu příslušné stanice a v Seznamu vlaků pro staniční zaměstnance, do doby uvedení těchto kontaktů v TTP."], "jistota": "střední", "poznamka": "Otázka je formulována neúplně (bez možností). Primární zdroj je PŘ GSM-R CZ Příloha B (na PPD), výhledově TTP; Z11 odkazuje obecně na Telefonní seznam GSM-R CZ."}, {"n": 4, "otazka": "Jaké údaje (FN a FC) nastaví strojvedoucí HV na radiostanici v systému GSM-R při posunu z depa na vlak?", "obrazky": [], "tema": "GSM-R a rádio", "predpis": "SŽ Z11", "zdroje": [{"predpis": "SŽ Z11", "clanek": "čl. 58 odst. (4) h)"}, {"predpis": "SŽ Z11", "clanek": "čl. 47 odst. (3)"}, {"predpis": "SŽ Z11", "clanek": "Příloha I"}], "odpoved": "Zaregistruje FN vlaku (CT 2 + pětimístné číslo vlaku) s funkčním kódem FC 01, pokud toto FN dosud není obsazeno stávajícím vedoucím HDV vlaku.", "plne_zneni": "SŽ Z11 čl. 58 odst. (4): Ponechání registrovaného FN s FC 01 lze použít při posunu v těchto případech: […] h) pro jízdu HDV od vlaku do depa / na vlečku (pokud není nutné použít FN pro nově nastupující HDV stejného vlaku) a opačně pro jízdu HDV z depa/vlečky na vlak (pokud není shodné FN vlaku dosud obsazeno stávajícím vedoucím HDV); […]\n\nSŽ Z11 čl. 58 odst. (8): FN s FC 03 nebo FC 04 pro spojení „bod – bod“ při posunu (včetně čekání na provozní výkon a souvisejícího provedení posunu) jsou z důvodu přehlednosti v organizaci práce v řízeném obvodu k dispozici výpravčímu pro příslušnou oblast a jejich použití zcela podléhá jeho rozhodnutí a provozním potřebám. […]\n\nSŽ Z11 čl. 47 odst. (3), tabulka 17 – Funkční kódy: 01 vedoucí HDV na vlaku; 02 vlakové HDV na vlaku s přípřežním HDV nebo vložené HDV; 03 HDV odstupující od vlaku nebo čekající na vlak; 04 HDV odstupující od vlaku nebo čekající na vlak; 05 postrkové HDV.", "distraktory": ["Zaregistruje FN vlaku (CT 2 + pětimístné číslo vlaku) s funkčním kódem FC 03; FC 01 nastaví až po přivěšení na soupravu a zkoušce brzdy.", "Zaregistruje FN HDV (CT 3 + 54 + šestimístné číslo HDV) s funkčním kódem FC 01; FN vlaku zaregistruje až po ukončení posunu na pokyn výpravčího."], "jistota": "vysoká", "poznamka": ""}, {"n": 5, "otazka": "Jaký bude postup strojvedoucího, který nezná po ukončení jízdy vlaku další nasazení HV a radiostanici má zaregistrovanou v systému GSM-R?", "obrazky": [], "tema": "GSM-R a rádio", "predpis": "SŽ Z11", "zdroje": [{"predpis": "SŽ Z11", "clanek": "čl. 52 odst. (1)"}, {"predpis": "SŽ Z11", "clanek": "čl. 58 odst. (8)"}], "odpoved": "Provede odregistraci FN vlaku (radiostanice zůstane přihlášena bez FN); FN s FC 03/04 pro čekání na výkon a posun přidělí výpravčí.", "plne_zneni": "SŽ Z11 čl. 52 odst. (1): Strojvedoucí vlaku (PMD) musí provést odregistraci FN vlaku s funkčním kódem (FC) odpovídajícím jeho provozní pozici a podle pokynů platných DAP v těchto případech: • po ukončení jízdy vlaku v cílové stanici uvnitř oblasti vybavené GSM-R CZ, vyjma případů uvedených v odstavcích (2) až (5) čl. 58; […] • před ukončením provozu HDV uvnitř oblasti vybavené GSM-R CZ; […]\n\nSŽ Z11 čl. 58 odst. (8): FN s FC 03 nebo FC 04 pro spojení „bod – bod“ při posunu (včetně čekání na provozní výkon a souvisejícího provedení posunu) jsou z důvodu přehlednosti v organizaci práce v řízeném obvodu k dispozici výpravčímu pro příslušnou oblast a jejich použití zcela podléhá jeho rozhodnutí a provozním potřebám. • Výpravčí tak může využít FN s FC 03 nebo FC 04 dle vlastních dispozic, s přihlédnutím k informacím od strojvedoucích o dalším nasazení HDV […]. • Pokud není v PŘ GSM-R […] uvedeno jinak, je používání FN s FC 03 nebo FC 04 při přepnutí ze základního rádiového spojení do rádiového spojení „bod – bod“ pro komunikaci při posunu a zpět do základního rádiového spojení, vždy podmíněno souhlasem výpravčího nebo může být realizováno pouze na jeho pokyn!", "distraktory": ["Provede odregistraci FN vlaku (radiostanice zůstane přihlášena bez FN); FN s FC 03/04 pro čekání na výkon a posun si nastaví sám.", "Ponechá FN vlaku s FC 01 zaregistrované, dokud se nedozví další nasazení HV; teprve poté FN změní nebo odregistruje."], "jistota": "vysoká", "poznamka": ""}, {"n": 6, "otazka": "Jaké volací číslo použije strojvedoucí pro volání hnacího vozidla Českých drah, a.s. 162 053-3 v systému GSM-R?", "obrazky": [], "tema": "GSM-R a rádio", "predpis": "SŽ Z11", "zdroje": [{"predpis": "SŽ Z11", "clanek": "Příloha H, tab. H.1 a bod H.1.1"}, {"predpis": "SŽ Z11", "clanek": "čl. 47 odst. (2)"}], "odpoved": "FN HDV = CT 3 + kód země 54 + šestimístné číslo HDV bez kontrolní číslice + FC 01, tedy 3 54 162 053 01.", "plne_zneni": "SŽ Z11 Příloha H, tab. H.1 – Sestavení FN podle typu hnacího vozidla: HDV CZ (54) v čele vlaku – Z PA zjistit číslo HDV (např. 162 001) – volba FN na terminálu: 3 54 162 001 01.\n\nSŽ Z11 Příloha H bod H.1.1 (1): Vstupní podmínky sestavy FN: a) Typ spojení (CT) 3 – HV / 4 – řídící vozy; b) Země registrace (RRC) 54 – ČR / 56 – Slovensko / 51 – Polsko; c) Číslo HDV (EN) 6 čísel HDV bez kontrolní číslice; d) Číslo řídícího vozu (EN) 7 čísel HDV bez kontrolní číslice; e) Funkční kód (FC) 01 / 01 nebo 02 (souprava LEO EXPRESS).\n\nSŽ Z11 čl. 47 odst. (2), tabulka 16 – Typy volání: 2 FN vlaku; 3 FN HDV; 4 FN vozu; […]", "distraktory": ["FN HDV = CT 3 + kód země 54 + číslo HDV včetně kontrolní číslice + FC 01, tedy 3 54 162 053 3 01.", "FN HDV = CT 4 + kód země 54 + šestimístné číslo HDV bez kontrolní číslice + FC 01, tedy 4 54 162 053 01."], "jistota": "vysoká", "poznamka": ""}, {"n": 7, "otazka": "Jak zní informace o návěsti dovolující jízdu vlaku telekomunikačním zařízením pro vlak 19524, který stojí na třetí koleji ve stanici Eden?", "obrazky": [], "tema": "Výprava a odjezd", "predpis": "SŽ D1", "zdroje": [{"predpis": "SŽ D1", "clanek": "čl. 358 odst. (2) a)"}, {"predpis": "SŽ D1", "clanek": "čl. 358 odst. (1)"}], "odpoved": "„Odjezdové návěstidlo S3 ve stanici Eden dovoluje jízdu vlaku 19524.“ (sudý vlak odjíždí ze 3. koleje kolem návěstidla S3)", "plne_zneni": "SŽ D1 čl. 358 odst. (1): Ustanovení tohoto článku se aplikují v případě, že příslušné návěstidlo dovoluje jízdu vlaku, ale strojvedoucí na návěst návěstidla, kterým je vypravován, nevidí.\n\nSŽ D1 čl. 358 odst. (2): Výpravčí může informovat strojvedoucího vlaku telekomunikačním zařízením o skutečnosti, že návěst návěstidla dovoluje jízdu vlaku (i v případě poškození návěstního napodobovače) takto:\na) pokud je jízda vlaku kolem návěstidla dovolována návěstí dovolující jízdu vlaku (vyjma PN, Jízda podle rozhledových poměrů nebo Rychlost 40 km/h a jízda podle rozhledových poměrů):\n• „Cestové návěstidlo Lc3 ve stanici Luh dovoluje jízdu vlaku 881.“ nebo\n• „Stop značka Lc3 ve stanici Luh dovoluje jízdu vlaku 881.\"\nb) pokud je jízda vlaku kolem návěstidla dovolována PN:\n• „Odjezdové návěstidlo S3 ve stanici Luh dovoluje jízdu vlaku 882 přivolávací návěstí.“ […]\nc) pokud je jízda vlaku kolem návěstidla dovolována Jízda podle rozhledových poměrů nebo Rychlost 40 km/h a jízda podle rozhledových poměrů:\n• „Cestové návěstidlo Lc3 ve stanici Luh nařizuje jízdu vlaku 881 podle rozhledových poměrů.“", "distraktory": ["„Odjezdové návěstidlo L3 ve stanici Eden dovoluje jízdu vlaku 19524.“ (sudý vlak odjíždí ze 3. koleje kolem návěstidla L3)", "„Odjezdové návěstidlo S3 ve stanici Eden dovoluje jízdu vlaku 19524 přivolávací návěstí.“ (odjezd sudého vlaku ze 3. koleje)"], "jistota": "vysoká", "poznamka": "Označení návěstidla (S3 pro sudý směr) vyplývá z čísla vlaku 19524 (sudé) a koleje 3; předpokládá se odjezd návěstí dovolující jízdu (ne PN)."}, {"n": 8, "otazka": "Za jízdy vlaku R 663 za ŽST Nezvěstice dojde k poruše radiostanice a strojvedoucí se nemůže spojit s výpravčím (dispečerem) jiným způsobem. Jak bude strojvedoucí postupovat?", "obrazky": ["img/q008_1.png"], "tema": "GSM-R a rádio", "predpis": "SŽ Z11", "zdroje": [{"predpis": "SŽ Z11", "clanek": "čl. 69 odst. (2)"}, {"predpis": "SŽ Z11", "clanek": "čl. 13 odst. (3)"}, {"predpis": "SŽ Z11", "clanek": "čl. 70 odst. (2)"}, {"predpis": "SŽ Z11", "clanek": "čl. 64 odst. (3)"}], "odpoved": "Pokračuje rychlostí nejvýše 100 km/h do nejbližší stanice (Blovice), kde zastaví a poruchu neprodleně ohlásí výpravčímu; dál jede jen podle jeho pokynů.", "plne_zneni": "SŽ Z11 čl. 69 odst. (2): Dojde-li k náhlé ztrátě funkčnosti základního nebo náhradního rádiového spojení v době, kdy je vlak (PMD) používá, je strojvedoucí povinen o této skutečnosti neprodleně informovat příslušného výpravčího, který řídí úsek, v němž se vlak (PMD) nachází a dále musí být postupováno v souladu s ustanovením odst. (2) následujícího článku.\n\nSŽ Z11 čl. 13 odst. (3): Poruchu VR ohlašuje strojvedoucí dle vnitřních předpisů dopravce a pokyny pro její ohlášení musí být uvedeny v příslušném PŘ RS. O poruše VR musí strojvedoucí vždy neprodleně informovat příslušného výpravčího (dispečera). V případě poruchy VR při jízdě vlaku (PMD) jsou další podmínky uvedeny v čl. 70.\n\nSŽ Z11 čl. 70 odst. (2): Strojvedoucí po odjezdu vlaku z výchozí ŽST oznámil poruchu základního rádiového spojení na HDV prostřednictvím nouzového spojení: Výpravčí […] a) ohlásí zjištěné skutečnosti provoznímu dispečerovi a projedná s ním jízdu vlaku do nejbližší vhodné ŽST […]; b) nařídí strojvedoucímu sepsání písemného rozkazu, ve kterém mu nařídí nepřekročit rychlost 100 km/hod (pokud je rychlost vlaku vyšší); c) jízda vlaku může být následně dovolena nejdále do nejbližší vhodné ŽST.\n\nSŽ Z11 čl. 70 odst. (3): […] Pokud se výpravčímu nepodaří se strojvedoucím navázat spojení ani prostřednictvím nouzového spojení, ohlásí zjištěné skutečnosti provoznímu dispečerovi a projedná s ním zastavení vlaku v nejbližší vhodné ŽST.\n\nSŽ Z11 čl. 64 odst. (3): Při použití nouzového spojení, jako jediného dostupného spojení na HDV, nesmí strojvedoucí překročit rychlost 100 km/h.", "distraktory": ["Pokračuje rychlostí nejvýše 100 km/h do nejbližší stanice s pravidelným pobytem podle TJŘ (Nepomuk), kde poruchu ohlásí výpravčímu; dál jede podle jeho pokynů.", "Ihned zastaví na širé trati, vlak zajistí proti ujetí a vyčká, až se s ním výpravčí spojí prostřednictvím jiného vlaku nebo zaměstnance na trati."], "jistota": "střední", "poznamka": "Předpisy neobsahují výslovný postup strojvedoucího pro případ úplné ztráty všech spojení za jízdy; odpověď je odvozena z povinnosti neprodleně informovat výpravčího (čl. 13 (3), 69 (2)), z limitu 100 km/h a z principu jízdy nejdále do nejbližší vhodné ŽST (čl. 70). Podle TJŘ je nejbližší stanice za Nezvěsticemi Blovice."}, {"n": 9, "otazka": "Jak provede strojvedoucí zkoušku spojení v systému GSM-R?", "obrazky": [], "tema": "GSM-R a rádio", "predpis": "SŽ Z11", "zdroje": [{"predpis": "SŽ Z11", "clanek": "čl. 53 písm. a)"}, {"predpis": "SŽ Z11", "clanek": "čl. 10 odst. (4)"}], "odpoved": "Zaregistrováním FN vlaku v síti GSM-R CZ a kontrolou výsledku funkční registrace na displeji vozidlové radiostanice; provedení se nezapisuje.", "plne_zneni": "SŽ Z11 čl. 53: Zkouška spojení se provádí z důvodu ověření funkčnosti pohyblivého terminálu ve vztahu k zajištění potřebné rádiové komunikace. Provedení zkoušky spojení se nezapisuje.\na) Uživatel koncového mobilního terminálu (VR) provede zkoušku spojení zaregistrováním FN v síti GSM-R CZ a následně zkontroluje výsledek funkční registrace podle údajů na displeji VR.\nb) Uživatel koncového mobilního terminálu (přenosný MT) provede zkoušku spojení po jeho zapnutí a jeho automatické registraci v síti GSM-R, příp. po zaregistrování FN odpovídajícímu svému pracovnímu zařazení a zkontroluje výsledek funkční registrace podle údajů na displeji MT.", "distraktory": ["Zaregistrováním FN vlaku v síti GSM-R CZ a následným hlasovým voláním výpravčího zkrácenou volbou 1300; provedení zkoušky výpravčí zapíše.", "Odesláním kódovaného hlášení „D“ výpravčímu a vyčkáním na kódový příkaz „Potvrzení zkoušky“ na displeji radiostanice; zápis se neprovádí."], "jistota": "vysoká", "poznamka": ""}, {"n": 10, "otazka": "Vlak zastavil v ŽST Praha Dejvice. V jaký čas může odjet?", "obrazky": ["img/q010_1.png"], "tema": "Výprava a odjezd", "predpis": "SŽ D1", "zdroje": [{"predpis": "SŽ D1", "clanek": "čl. 287 odst. (5) e)"}, {"predpis": "SŽ D1", "clanek": "čl. 287 odst. (5)"}], "odpoved": "Vlak může po výpravě odjet s náskokem nejdříve v čase pravidelného příjezdu, tj. v 8:08; nemusí čekat na pravidelný odjezd 8:11,5.", "plne_zneni": "SŽ D1 čl. 287 odst. (5): S náskokem nesmí odjet žádný vlak s přepravou cestujících, jehož doba odjezdu byla závazně oznámena veřejnosti. Odjezd vlaku s přepravou cestujících s náskokem je však dovolen: a) u vlaku ve stanici pravidelně projíždějícího; b) je-li v TJŘ vlaku před časovým údajem příjezdu značka „+“, vyjadřující zastavení z dopravních důvodů […]; c) je-li v TJŘ vlaku před časovým údajem příjezdu značka […], vyjadřující nezveřejněné zastavení […] „SLD“ […]; d) je-li v TJŘ vlaku před časovým údajem příjezdu značka […], vyjadřující zastavení jen pro výstup cestujících […] „Vyst“ […]; e) je-li v TJŘ vlaku před časovým údajem odjezdu značka [plný trojúhelník], vyjadřující možnost odjezdu vlaku s přepravou cestujících s náskokem ihned po výstupu cestujících nebo [prázdný trojúhelník], vyjadřující možnost odjezdu vlaku s náskokem nejdříve však v čase pravidelného příjezdu; f) je-li to dovoleno pomůckou „Přípoje mezi vlaky osobní dopravy“ […].", "distraktory": ["Vlak může po výpravě odjet s náskokem ihned po ukončení výstupu cestujících, tedy i před časem pravidelného příjezdu 8:08.", "Vlak s přepravou cestujících nesmí odjet s náskokem; odjede nejdříve v čase pravidelného odjezdu 8:11,5 po uplynutí pobytu."], "jistota": "střední", "poznamka": "Grafické značky (plný/prázdný trojúhelník) se v textové verzi D1 nezobrazují; v obrázku TJŘ je před časem odjezdu prázdný (obrysový) trojúhelník, který podle znění čl. 287 (5) e) znamená odjezd s náskokem nejdříve v čase pravidelného příjezdu (8:08). Byl-li by trojúhelník plný, platila by možnost odjezdu ihned po výstupu cestujících."}, {"n": 11, "otazka": "Strojvedoucí zastavil s vlakem bez ETCS u návěsti AB s návěstí „Stůj“ za mlhy. Jiná vozidla v následujícím traťovém oddílu nevidí. Jak bude postupovat?", "obrazky": [], "tema": "Návěsti", "predpis": "SŽ D1", "zdroje": [{"predpis": "SŽ D1", "clanek": "čl. 107 odst. (4) a)"}, {"predpis": "SŽ D1", "clanek": "čl. 23 odst. (2)"}, {"predpis": "SŽ D1", "clanek": "čl. 107 odst. (7)"}], "odpoved": "Jde-li o AB s bílým označovacím pásem, může po zastavení bez svolení výpravčího pokračovat a k následujícímu hlavnímu návěstidlu jet podle rozhledových poměrů, nejvýše 40 km/h.", "plne_zneni": "SŽ D1 čl. 107 odst. (4): Je-li na oddílovém návěstidle AB s bílým označovacím pásem návěst Stůj, musí strojvedoucí vlaku s vedoucím vozidlem nevybaveným ETCS nebo s vedoucím vozidlem vybaveným mobilní částí ETCS, který nejede v módu Plný dohled (FS) nebo v módu Podle rozhledu (OS) před tímto návěstidlem zastavit a postupovat následovně:\na) Nevidí-li v následujícím traťovém oddílu drážní vozidlo, může pokračovat v další jízdě za návěstidlo s návěstí Stůj a k následujícímu hlavnímu návěstidlu musí dodržet podmínky jízdy podle rozhledových poměrů.\nb) Vidí-li v následujícím traťovém oddílu drážní vozidlo, musí vyčkat, až drážní vozidlo odjede z dohledu. […]\n\nSŽ D1 čl. 107 odst. (7): V případě, že je na oddílovém návěstidle AB s bílým označovacím pásem zřízen štít Op, musí strojvedoucí vlaku, který nejede v módu Plný dohled (FS) nebo Podle rozhledu (OS) při jízdě za toto oddílové návěstidlo AB na návěst Stůj dodržet podmínky jízdy se zvýšenou opatrností přes přejezdy s PZZ v následujícím traťovém oddílu.\n\nSŽ D1 čl. 23 odst. (2): Pokud je strojvedoucímu nařízena jízda podle rozhledových poměrů, musí pokračovat opatrně v další jízdě a kontrolovat rychlost s přihlédnutím k délce tratě, na kterou před sebou vidí […], aby byl schopen na volné viditelné části tratě zastavit před jakýmkoliv drážním vozidlem, návěstí Stůj nebo překážkou na trati […], přičemž však nesmí být překročena rychlost 40 km/h.", "distraktory": ["Jde-li o AB s bílým označovacím pásem, může po zastavení bez svolení výpravčího pokračovat a k následujícímu hlavnímu návěstidlu jet podle rozhledových poměrů, nejvýše 30 km/h.", "Za mlhy nesmí pokračovat podle rozhledových poměrů; po 5 minutách se ohlásí výpravčímu přední stanice a dál smí jet až na jeho pokyn daný písemným rozkazem."], "jistota": "vysoká", "poznamka": "Předpokládá se oddílové návěstidlo AB s bílým označovacím pásem; u návěstidla s červeno-bílými pruhy by platil čl. 108 (jízda jen na pokyn výpravčího)."}, {"n": 12, "otazka": "Při jízdě přes diagnostiku závad jedoucích vozidel (ASDEK) strojvedoucí musel vzhledem k vzniklé situaci použít průběžnou brzdu. Jak bude následně postupovat při obdržení informace od výpravčího např.: „Vlak číslo, indikována horká obruč stupně K, zastavte ve stanici“?", "obrazky": [], "tema": "Mimořádné události", "predpis": "SŽ V65/1", "zdroje": [{"predpis": "SŽ V65/1", "clanek": "postup strojvedoucího při indikaci stupně K (předpis není ve složce)"}, {"predpis": "ČD V2", "clanek": "Příloha 8 (Horké ložisko)"}, {"predpis": "SŽ D1", "clanek": "čl. 26 odst. (5)"}], "odpoved": "Pokyn zopakuje a potvrdí, výpravčímu sdělí použití průběžné brzdy před ASDEK, ve stanici zastaví, prohlédne indikovaná kola a výsledek mu ohlásí.", "plne_zneni": "SŽ D1 čl. 26 odst. (5): Při vydávání pokynů při výkonu dopravní služby prostřednictvím telekomunikačního zařízení musí být zřejmé, kdo pokyn vydává a kdo pokyn přijímá. […] Zaměstnanec, který potvrzuje přijetí pokynu telekomunikačním zařízením pro jízdu vlaku, musí pokyn zopakovat a potvrdit na důkaz, že jej správně pochopil.\n\nČD V2 Příloha 8 (Horké ložisko): Nelze dále provozovat na vlaku osobní dopravy. Další pohyb s vozidlem ze stanice je zakázán. Rychlost jízdy do nejbližší stanice nejvýše 30/20 km/h. Ložisko označené IHL může být ponecháno v provozu za předpokladu, že o jeho dalším zařazení rozhodne vozmistr nebo strojvedoucí, pokud při provedené prohlídce: má ložisko obvyklou teplotu, ostatní ložiska téhož vozu a obou sousedních mají obvyklou provozní teplotu.\n\n(SŽ V65/1 Předpis pro provozování diagnostiky závad jedoucích vozidel – text není ve složce k dispozici; podle něj strojvedoucí při indikaci stupně K zastaví v určené stanici, prohlédne indikovaná vozidla a použití brzdy před ASDEK ohlásí výpravčímu.)", "distraktory": ["Pokyn zopakuje a potvrdí, výpravčímu sdělí použití průběžné brzdy před ASDEK, a proto ve stanici nezastavuje a pokračuje v jízdě bez prohlídky kol.", "Ihned zastaví vlak na širé trati rychločinným brzděním, prohlédne všechna kola vlaku a do nejbližší stanice pokračuje rychlostí nejvýše 10 km/h."], "jistota": "nízká", "poznamka": "Chybí předpis SŽ (SŽDC/ČD) V65/1, který postup při indikaci ASDEK/IHL (stupně K a STOP) stanoví; v D1 i Z11 je ASDEK jen citován (D1 seznam citovaných dokumentů). Odpověď je podle nejlepší znalosti – stupeň K = kontrola ve stanici, brzdění před ASDEK je nutno výpravčímu ohlásit jako možnou příčinu indikace horké obruče."}, {"n": 13, "otazka": "Ve sloupci 2 TJŘ za názvem stanice Opatov je uvedena značka „3>“. Jakou nejvyšší dovolenou rychlostí může strojvedoucí jet v červeně vyznačeném úseku?", "obrazky": ["img/q013_1.png"], "tema": "Návěsti", "predpis": "SŽ D1", "zdroje": [{"predpis": "SŽ D1", "clanek": "čl. 113 odst. (11)"}, {"predpis": "SŽ D1", "clanek": "čl. 113 odst. (1) a)"}, {"predpis": "SŽ D1", "clanek": "čl. 499"}, {"predpis": "SŽ D1", "clanek": "čl. 138 odst. (1)"}], "odpoved": "V obvodu výhybek přilehlých k návěstidlu nejvýše 40 km/h (návěst Rychlost 40 km/h a výstraha); značka „3>“ platí jen na PN nebo u neobsluhovaného návěstidla.", "plne_zneni": "SŽ D1 čl. 113 odst. (11): Rychlost 40 km/h a výstraha – žluté světlo a nad ním žluté světlo.\n\nSŽ D1 čl. 113 odst. (1): Návěsti vyjádřené dvěma světly dovolují jízdu vlaku a: a) Dolním světlem, případně doplněný indikátorem […] přikazují strojvedoucímu jet v obvodu výhybek přilehlých k hlavnímu návěstidlu nejvýše návěstěnou rychlostí. […] b) Horním světlem, příp. doplněný indikátorem […] předvěstí návěst následujícího hlavního návěstidla. Předvěstění je vyjádřeno druhou částí názvu návěsti: … a výstraha, … a volno […].\n\nSŽ D1 čl. 499: Ve stanicích, kde je snížení rychlosti návěstěno indikátorem, musí být v TJŘ všech vlaků příslušného směru jízdy (bez ohledu na určenou vjezdovou nebo odjezdovou kolej) u této stanice značka „3>“, která udává vjezdovou (odjezdovou) rychlost 30 km/h, jež nesmí strojvedoucí překročit při jízdě na PN a při jízdě kolem neobsluhovaného návěstidla. Značka „3>“ se neuvádí u vlaků se stanovenou rychlostí 30 km/h nebo nižší.\n\nSŽ D1 čl. 138 odst. (1): Přivolávací návěst […] strojvedoucímu ostatních vlaků […] nařizuje jet v obvodu výhybek přilehlých k hlavnímu návěstidlu nejvýše rychlostí 30 km/h: 1. pokud je návěstidlo označeno indikátorovou tabulkou s číslicí „3“ nebo 2. je-li v TJŘ u příslušné stanice značka „3>“.", "distraktory": ["V obvodu výhybek přilehlých k návěstidlu nejvýše 30 km/h, protože značka „3>“ v TJŘ platí i při návěsti Rychlost 40 km/h a výstraha, a u S1 očekávat Stůj.", "V obvodu výhybek nejvýše 40 km/h a od návěstidla dál podle rozhledových poměrů nejvýše 30 km/h k návěstidlu S1, jak nařizuje značka „3>“ v TJŘ."], "jistota": "vysoká", "poznamka": "Na obrázku návěstidlo S ukazuje dvě žlutá světla bez indikátoru, tj. návěst Rychlost 40 km/h a výstraha; červený úsek vede přes výhybky na 1. kolej k odjezdovému návěstidlu S1 s návěstí Stůj."}, {"n": 14, "otazka": "Výpravčí doručí na hnací vozidlo písemný rozkaz. Jak bude postupovat strojvedoucí?", "obrazky": [], "tema": "Písemné rozkazy", "predpis": "SŽ D1/1", "zdroje": [{"predpis": "SŽ D1/1", "clanek": "čl. 6 odst. (18)"}, {"predpis": "SŽ D1/1", "clanek": "čl. 6 odst. (20)"}, {"predpis": "SŽ D1/1", "clanek": "čl. 8 odst. (5)"}], "odpoved": "Rozkaz si nejprve přečte a teprve poté jej potvrdí na prvopisu příjmením hůlkovým písmem a vlastnoručním podpisem; je-li pokyn v rozporu s předpisy, převzetí odmítne.", "plne_zneni": "SŽ D1/1 čl. 6 odst. (18): Zaměstnanec, který písemný rozkaz ve svazku přijímá, je povinen si jej přečíst ještě před potvrzením a teprve následně jej potvrdit (uvedením příjmení, a to rukopisně čitelným hůlkovým písmem a vlastnoručním podpisem) na prvopisu písemného rozkazu. Přebírající zaměstnanec potvrzuje, že: a) se s rozkazem (rozkaz 90) v písemném rozkazu PsV seznámil a rozumí mu; b) se s pokynem (pokyny) v písemném rozkazu seznámil, a rozumí mu (jim); c) písemný rozkaz převzal. […] Pokud je pokyn (pokyny) v rozporu s tímto předpisem, příp. i souvisejícími předpisy […], nebo zaměstnanec, který rozkaz přijímá, zjistil, že pokyn (pokyny) neodpovídá (neodpovídají) skutečnému stavu infrastruktury, odmítne písemný rozkaz převzít a oznámí zaměstnanci, který mu písemný rozkaz doručil, důvod odmítnutí převzetí.\n\nSŽ D1/1 čl. 6 odst. (20): Jestliže přebírající zaměstnanec některé části písemného rozkazu nerozumí, dotáže se zaměstnance, který písemný rozkaz vydává. Ten je povinen sporné pasáže vysvětlit nebo vysvětlení zprostředkovat.\n\nSŽ D1/1 čl. 8 odst. (5): Po celou dobu jízdy vlaku (PMD, posunového dílu) musí být u strojvedoucího všechny převzaté písemné rozkazy a platný SPO pro danou trať.", "distraktory": ["Rozkaz nejprve potvrdí na prvopisu příjmením hůlkovým písmem a vlastnoručním podpisem a teprve poté si jej přečte; nerozumí-li mu, řídí se pokyny výpravčího.", "Rozkaz si přečte a jeho převzetí potvrdí pouze ústně výpravčímu telekomunikačním zařízením; podpis na prvopisu se vyžaduje jen u diktovaného rozkazu."], "jistota": "vysoká", "poznamka": ""}, {"n": 15, "otazka": "Při kontrole chodu soupravy za jízdy průvan vynesl písemný rozkaz z okna kabiny a strojvedoucí si nepamatuje obsah písemného rozkazu pro další úsek. Jaký bude jeho další postup?", "obrazky": [], "tema": "Písemné rozkazy", "predpis": "SŽ D1/1", "zdroje": [{"predpis": "SŽ D1/1", "clanek": "čl. 8 odst. (6)"}], "odpoved": "Pokračuje do nejbližší stanice podle rozhledových poměrů, přes přejezdy jako při jízdě se zvýšenou opatrností, tam zastaví a požádá o nové zpravení písemným rozkazem.", "plne_zneni": "SŽ D1/1 čl. 8 odst. (6): Dojde-li ke ztrátě nebo poškození rozkazu (tzn. poškození takového charakteru, kdy se rozkaz stává nečitelným nebo nesrozumitelným) za neprojetou trať a strojvedoucí obsah ztraceného (poškozeného) písemného rozkazu nezná, musí: a) Pokračovat v další jízdě do nejbližší stanice podle rozhledových poměrů. V této stanici musí vlak zastavit a požádat o nové zpravení písemným rozkazem pro další jízdu vlaku (PMD). b) Při jízdě přes všechny přejezdy [centrální přechody s výstražným zařízením pro přechod kolejí (dále jen „VZPK“)] jednat, jako by mu byla nařízena jízda se zvýšenou opatrností. Podle písm. a) a b) tohoto odstavce nemusí strojvedoucí jednat, pokud zná obsah ztracených (poškozených) rozkazů, nebo pokud může požádat před pokračováním jízdy výpravčího telekomunikačním zařízením o nadiktování nového písemného rozkazu. Vzniklé narušení jízdy vlaku z tohoto důvodu bude evidováno jako závada na straně dotčeného dopravce.", "distraktory": ["Pokračuje do nejbližší stanice podle rozhledových poměrů, přes přejezdy jako při jízdě se zvýšenou opatrností, tam zastaví a vyžádá si od dopravce nový SPO.", "Ihned zastaví na širé trati, ztrátu rozkazu ohlásí výpravčímu a pokračovat smí až po doručení nového písemného rozkazu; podle rozhledových poměrů nejede."], "jistota": "vysoká", "poznamka": ""}, {"n": 16, "otazka": "Strojvedoucí má poruchu tabletu a nepamatuje si znění textu SPO pro úsek ve kterém vede vlak. Jaký bude jeho další postup?", "obrazky": [], "tema": "Písemné rozkazy", "predpis": "SŽ D1/1", "zdroje": [{"predpis": "SŽ D1/1", "clanek": "čl. 8 odst. (7)"}, {"predpis": "ČD D2", "clanek": "čl. 13"}], "odpoved": "Pokračuje do nejbližší stanice podle rozhledových poměrů, přes přejezdy s PZZ jako se zvýšenou opatrností, tam zastaví, informuje výpravčího a vyžádá si od dopravce nový SPO.", "plne_zneni": "SŽ D1/1 čl. 8 odst. (7): Dojde-li ke ztrátě nebo poškození SPO (tzn. poškození takového charakteru, kdy se SPO stává nečitelným nebo nesrozumitelným) za neprojetou trať a strojvedoucí obsah ztraceného (poškozeného) SPO nezná, musí: a) Pokračovat v další jízdě do nejbližší stanice podle rozhledových poměrů. V této stanici musí strojvedoucí zastavit, informovat o této skutečnosti výpravčího nejbližší stanice a vyžádat si nový SPO od dopravce. b) Při jízdě přes všechny přejezdy s přejezdovým zabezpečovacím zařízením (dále jen „PZZ“) (centrální přechody s VZPK) jednat, jako by mu byla nařízena jízda se zvýšenou opatrností. Vzniklé narušení jízdy vlaku z tohoto důvodu bude evidováno jako závada na straně dotčeného dopravce.\n\nČD D2 čl. 13: […] S vydaným SPO se musí strojvedoucí seznámit a potvrdit jeho seznámení ještě před uvedením vlaku, PMD nebo posunového dílu do pohybu. Strojvedoucí je povinen se seznámit jen s údaji v úsecích ve kterých vede vlak, PMD nebo posunový díl. […]", "distraktory": ["Pokračuje do nejbližší stanice podle rozhledových poměrů, přes přejezdy s PZZ jako se zvýšenou opatrností, tam zastaví a požádá výpravčího o nadiktování obsahu SPO.", "Pokračuje traťovou rychlostí do stanice, kde vlak pravidelně zastavuje, ohlásí poruchu tabletu dispečerovi dopravce a vyžádá si od něj nový SPO."], "jistota": "vysoká", "poznamka": "Porucha tabletu = SPO je pro strojvedoucího nečitelný/nedostupný; D1/1 řeší jen ztrátu/poškození SPO, postup je analogický. Alternativu 'požádat výpravčího o nadiktování' D1/1 připouští jen u písemného rozkazu (odst. 6), u SPO ne."}, {"n": 17, "otazka": "Strojvedoucí za jízdy zpozoruje světelný výstražný terč s návěstí „Práce na trati“. Kdy musí dávat návěst „Pozor“?", "obrazky": ["img/q017_1.png"], "tema": "Návěsti", "predpis": "SŽ D1", "zdroje": [{"predpis": "SŽ D1", "clanek": "čl. 148 odst. (3) písm. g)"}, {"predpis": "SŽ D1", "clanek": "čl. 185 odst. (3), (6)"}], "odpoved": "Opakovaně s krátkými přestávkami od okamžiku, kdy návěst Práce na trati zpozoruje; o umístění výstražného terče se nezpravuje.", "plne_zneni": "SŽ D1 čl. 148 odst. (3): K varování osob musí strojvedoucí dát návěst Pozor: […] g) Před pracovními místy – opakovaně, a to s krátkými přestávkami: 1. od místa, odkud zpozoruje výstražný kolík s dočasnou platností pro pracovní místo (při zpravení o pracovním místě), nejpozději od úrovně tohoto kolíku, do úrovně nepřenosného varovného návěstidla s návěstí Konec pracovního místa; 2. pokud zpozoruje návěst Práce na trati (viz čl. 185 tohoto předpisu).\n\nSŽ D1 čl. 185 odst. (3): Práce na trati – žluté zábleskové světlo nad označovacím pásem • označení pracovního místa • bezpečnost na pracovním místě zajišťuje vedoucí prací.\n\nSŽ D1 čl. 185 odst. (6): Strojvedoucí se o umístění světelného výstražného terče nezpravuje. Zpozoruje-li návěst Práce na trati nebo v průjezdném průřezu koleje, po které jede nebo pojede, nebo v bezprostřední blízkosti koleje, po které jede nebo pojede, se nachází jedna nebo více osob dává návěst Pozor (viz čl. 148 odst. (3) písm. b) a g)).", "distraktory": ["Jednou v úrovni výstražného terče a poté nejméně dvakrát opakovaně až k pracovnímu místu; o umístění terče se nezpravuje.", "Nejméně třikrát od vzdálenosti 250 m před terčem, dokud čelo vlaku nemine pracovní místo; o umístění terče musí být zpraven."], "jistota": "vysoká", "poznamka": ""}, {"n": 18, "otazka": "Jak bude strojvedoucí postupovat při obdržení informace „Vlak 9308, indikováno horké ložisko stupně STOP, okamžitě zastavte!“:", "obrazky": [], "tema": "Mimořádné události", "predpis": "SŽ V65/1 (chybí)", "zdroje": [{"predpis": "SŽ D1", "clanek": "čl. 341 odst. (1), (2)"}, {"predpis": "ČD V2", "clanek": "Příloha 8 (Horké ložisko)"}, {"predpis": "ČD V62", "clanek": "čl. 234"}], "odpoved": "Okamžitě zastaví všemi dostupnými prostředky, pokud možno mimo tunel, most a přejezd, zastavení ohlásí výpravčímu, prohlédne indikované ložisko a výsledek mu oznámí.", "plne_zneni": "SŽ D1 čl. 341 odst. (1): Je-li na vlaku závada, která by mohla ohrozit bezpečné provozování dráhy a drážní dopravy (např. horké ložisko, ploché kolo, části vozu nebo nákladu zjevně přesahující průjezdný průřez, otevřené dveře u vlaku s přepravou cestujících), musí zaměstnanec, který takovou závadu zjistil, učinit opatření, aby byl vlak co nejdříve zastaven. (2) Druh závady a místo jejího výskytu oznámí výpravčí (popř. jeho prostřednictvím jiný zaměstnanec) zaměstnanci dopravny, ve které má být z tohoto důvodu vlak zastaven, a strojvedoucímu dotčeného vlaku.\n\nČD V2 Příloha 8 (Horké ložisko): Zahřáté tak, že není možné se dotknout hřbetem ruky – Nelze dále provozovat na vlaku osobní dopravy. Další pohyb s vozidlem ze stanice je zakázán. Rychlost jízdy do nejbližší stanice nejvýše 30/20 km/h. Ložisko označené IHL může být ponecháno v provozu za předpokladu, že o jeho dalším zařazení rozhodne vozmistr nebo strojvedoucí, pokud při provedené prohlídce: má ložisko obvyklou teplotu, ostatní ložiska téhož vozu a obou sousedních mají obvyklou provozní teplotu.\n\nČD V62 čl. 234: Nápravové ložisko musí mít při provozu takovou teplotu, že je možné se dotknout jeho ložiskové skříně hřbetem ruky. […] Za horké ložisko je v provozu považováno také to, které je indikováno indikátorem horkých ložisek (IHL) a dosud nebylo prohlédnuto.", "distraktory": ["Okamžitě zastaví všemi dostupnými prostředky, pokud možno mimo tunel, most a přejezd, a bez prohlídky pokračuje do nejbližší stanice rychlostí nejvýše 30 km/h.", "Na širé trati nezastavuje, sníží rychlost na 30 km/h a dojede do nejbližší stanice, kde vyčká vozmistra; prohlídku ložiska sám neprovádí."], "jistota": "nízká", "poznamka": "Předpis SŽ (SŽDC) V65/1 pro diagnostiku závad jedoucích vozidel (ASDEK/IHL, stupně K a STOP) ve složce chybí; závazné znění a postup pro stupeň STOP nejsou v D1, Z11 ani D2. Odpověď sestavena podle nejlepší znalosti V65/1 a podpůrně z D1 čl. 341, V2 příl. 8 a V62 čl. 234."}, {"n": 19, "otazka": "Jaký bude postup strojvedoucího po zastavení u oddílového návěstidla AH s návěstí „Stůj“?", "obrazky": ["img/q019_1.png"], "tema": "Návěsti", "predpis": "SŽ D1", "zdroje": [{"predpis": "SŽ D1", "clanek": "čl. 106 odst. (1), (3)"}, {"predpis": "SŽ D1", "clanek": "čl. 139 odst. (1)"}, {"predpis": "SŽ D1/1", "clanek": "rozkaz 1, pokyn 1.10"}], "odpoved": "Vlak zůstane stát (Stůj má absolutní význam); stojí-li 5 minut a více, ohlásí se výpravčímu přední stanice. Dál smí jet jen na PN nebo písemný rozkaz.", "plne_zneni": "SŽ D1 čl. 106 odst. (1): Nejzávažnější návěstí na oddílovém návěstidle AH je návěst Stůj a má absolutní význam návěsti Stůj. (2) Oddílové návěstidlo AH platí pro vlaky. (3) Stojí-li vlak před návěstí Stůj oddílového návěstidla AH 5 minut a více, ohlásí se strojvedoucí výpravčímu přední stanice (popř. i prostřednictvím výpravčího zadní stanice). Je-li platné oddílové návěstidlo AH poškozené, ohlásí se strojvedoucí výpravčímu přední stanice ihned po zastavení vlaku u oddílového návěstidla AH (popř. výpravčímu zadní stanice).\n\nSŽ D1 čl. 139 odst. (1): Není-li možné pro poruchu nebo i z jiné příčiny (např. porucha kolejových obvodů) dovolit jízdu kolem: a) hlavního návěstidla jeho normální obsluhou, dovoluje ji výpravčí nebo strážník oddílu PN nebo písemným rozkazem; […]\n\nSŽ D1/1 rozkaz 1, pokyn 1.10 (popis): Nelze obsluhovat hlavní návěstidlo v dopravně s kolejovým rozvětvením. Nelze obsluhovat oddílové návěstidlo AH. […] Povoluje minout konec oprávnění k jízdě (EOA) nebo neobsluhované návěstidlo, je výpravou vlaku.", "distraktory": ["Vlak zůstane stát (Stůj má absolutní význam); stojí-li 5 minut a více, ohlásí se výpravčímu přední stanice. Dál smí jet jen na jeho ústní svolení.", "Návěst Stůj na AH je permisivní; po zastavení smí bez svolení pokračovat podle rozhledových poměrů nejvýše 40 km/h k následujícímu hlavnímu návěstidlu."], "jistota": "vysoká", "poznamka": ""}, {"n": 20, "otazka": "Jaký bude postup strojvedoucího po zastavení u zhaslého oddílového návěstidla AH?", "obrazky": ["img/q020_1.png"], "tema": "Návěsti", "predpis": "SŽ D1", "zdroje": [{"predpis": "SŽ D1", "clanek": "čl. 106 odst. (3)"}, {"predpis": "SŽ D1", "clanek": "čl. 129 odst. (1), (2)"}, {"predpis": "SŽ D1", "clanek": "čl. 132"}], "odpoved": "Zhaslé návěstidlo platí za Stůj (absolutní); jako poškozené se ohlásí výpravčímu přední stanice ihned po zastavení. Dál smí jet jen na PN nebo písemný rozkaz.", "plne_zneni": "SŽ D1 čl. 106 odst. (3): Stojí-li vlak před návěstí Stůj oddílového návěstidla AH 5 minut a více, ohlásí se strojvedoucí výpravčímu přední stanice (popř. i prostřednictvím výpravčího zadní stanice). Je-li platné oddílové návěstidlo AH poškozené, ohlásí se strojvedoucí výpravčímu přední stanice ihned po zastavení vlaku u oddílového návěstidla AH (popř. výpravčímu zadní stanice).\n\nSŽ D1 čl. 129 odst. (1): Zjistí-li zaměstnanec poškození hlavního návěstidla […] a nebyl-li o poruše zpraven, je povinen poruchu co nejdříve ohlásit výpravčímu […]. (2) Je-li návěstidlo poškozené a není kryto předepsanou návěstí, nebo není zaměstnanec zpraven o poruše tohoto návěstidla, musí se řídit tou návěstí, která je nejzávažnější; a) u hlavního návěstidla návěstí Stůj, […]\n\nSŽ D1 čl. 132: Poškozené oddílové návěstidlo AH se nekryje (nenahrazuje) přenosnou návěstí Stůj, jízdy vlaků se zabezpečují v mezistaničním oddíle, a strojvedoucí vlaku se o poškození oddílového návěstidla AH nezpravuje.", "distraktory": ["Zhaslé návěstidlo platí za Stůj (absolutní); výpravčímu přední stanice se ohlásí až po 5 minutách stání. Dál smí jet jen na PN nebo písemný rozkaz.", "Zhaslé oddílové návěstidlo AH je neplatné; po zastavení ohlásí poruchu výpravčímu a pokračuje podle rozhledových poměrů nejvýše 40 km/h k dalšímu návěstidlu."], "jistota": "vysoká", "poznamka": ""}, {"n": 21, "otazka": "V ŽST Mrákoty nelze z důvodu poruchy obsluhovat odjezdové návěstidlo L2. Výpravčí pouze zpraví strojvedoucího telekomunikačním zařízením takto: „Odjezdové návěstidlo L2 stanice Mrákoty se neobsluhuje. Vlak 9998 ve stanici Mrákoty z druhé koleje do stanice Chvojkovice odjezd.“ Uvede strojvedoucí vlak do pohybu?", "obrazky": ["img/q021_1.png"], "tema": "Výprava a odjezd", "predpis": "SŽ D1", "zdroje": [{"predpis": "SŽ D1", "clanek": "čl. 139 odst. (1)"}, {"predpis": "SŽ D1", "clanek": "čl. 356 odst. (3), (4)"}, {"predpis": "SŽ D1/1", "clanek": "čl. 12 odst. (11)"}, {"predpis": "SŽ D1/1", "clanek": "rozkaz 1, pokyn 1.10"}], "odpoved": "Ne. Jízdu kolem neobsluhovaného návěstidla lze dovolit jen PN nebo písemným rozkazem (rozkaz 1, pokyn 1.10); ten nelze dát pouze telekomunikačním zařízením, musí být sepsán.", "plne_zneni": "SŽ D1 čl. 139 odst. (1): Není-li možné pro poruchu nebo i z jiné příčiny (např. porucha kolejových obvodů) dovolit jízdu kolem: a) hlavního návěstidla jeho normální obsluhou, dovoluje ji výpravčí nebo strážník oddílu PN nebo písemným rozkazem; […]\n\nSŽ D1 čl. 356 odst. (3): Strojvedoucí nesmí ve stanici: a) projet bez výpravy, b) uvést vlak do pohybu bez výpravy. (4) Výprava vlaku se uskutečňuje: a) oprávněním k jízdě (MA) nebo b) návěstí hlavního návěstidla dovolující jízdu vlaku nebo c) návěstí DNS stop značky dovolující jízdu vlaku nebo d) výpravkou nebo e) písemným rozkazem.\n\nSŽ D1/1 čl. 12 odst. (11): Pokyn uvedený v písemném rozkaze může výpravčí […] strojvedoucímu vlaku (posunového dílu, PMD) nařídit, aniž by jej strojvedoucí byl povinen sepisovat, pokud: a) je hovor zaznamenáván záznamovým zařízením, a b) se jedná pouze o jeden pokyn, který může strojvedoucí […] vykonat bezprostředně (ihned) po ukončení hovoru […], a c) se jedná o některý z následujících pokynů: 2.10, 2.11, 7.10, 7.11, 52.30 nebo 52.40.\n\nSŽ D1/1 rozkaz 1 (význam): Informuje o povolení minout konec oprávnění k jízdě (EOA) pro vlak s aktivním ETCS v úrovni 2 a o povolení jízdy kolem neobsluhovaného návěstidla, je výpravou vlaku.", "distraktory": ["Ano. Jízdu kolem neobsluhovaného návěstidla lze dovolit i pokynem podle rozkazu 1 (pokyn 1.10) daným pouze telekomunikačním zařízením; vlak odjede podle rozhledových poměrů.", "Ano, ale jen je-li hovor zaznamenáván záznamovým zařízením; strojvedoucí pokyn potvrdí příjmením a odjede podle rozhledových poměrů bez sepsání písemného rozkazu."], "jistota": "vysoká", "poznamka": ""}, {"n": 22, "otazka": "Vlak s přepravou cestujících vjíždí do stanice Liptákov na návěst „Výstraha“ vjezdového návěstidla. Na odjezdovém návěstidle platném pro jednu kolej je návěst „Přivolávací návěst“. Jak bude strojvedoucí postupovat?", "obrazky": ["img/q022_1.png"], "tema": "Výprava a odjezd", "predpis": "SŽ D1", "zdroje": [{"predpis": "SŽ D1", "clanek": "čl. 362 odst. (2) písm. b)"}, {"predpis": "SŽ D1", "clanek": "čl. 138 odst. (1), (12), (13)"}, {"predpis": "SŽ D1", "clanek": "čl. 361 odst. (4)"}], "odpoved": "Vlak podle TJŘ projíždí a vjezd byl dovolen návěstí nenařizující zastavení, PN je proto výpravou; stanicí projede podle rozhledových poměrů nejvýše 40 km/h.", "plne_zneni": "SŽ D1 čl. 362 odst. (2): Výpravu vlaku návěstí hlavního návěstidla může výpravčí uskutečnit: a) u odjíždějícího vlaku jen z dopravní koleje, u které je: 1. Odjezdové, cestové nebo vložené návěstidlo platné jen pro jednu kolej. […] b) u projíždějícího vlaku návěstí odjezdového návěstidla: 1. byl-li dovolen vjezd vlaku návěstí, která nenařizuje zastavení ve stanici (a nebyl-li vlak zastaven u vjezdového návěstidla stanice s hlavními návěstidly na sobě nezávislými), a to i pokud výprava vlaku podle písm. a) tohoto odstavce není dovolena. 2. v ostatních případech, jen pokud je dovolena i výprava odjíždějících vlaků návěstí hlavního návěstidla.\n\nSŽ D1 čl. 138 odst. (1): Přivolávací návěst – přerušované bílé světlo […] strojvedoucímu ostatních vlaků • dovoluje jízdu kolem návěstidla, u kterého nelze rozsvítit návěsti dovolující jízdu vlaku • nařizuje jízdu podle rozhledových poměrů (viz odst. (6), (7) a (13) tohoto článku) • nařizuje jet v obvodu výhybek přilehlých k hlavnímu návěstidlu nejvýše rychlostí 30 km/h: 1. pokud je návěstidlo označeno indikátorovou tabulkou s číslicí „3“ nebo 2. je-li v TJŘ u příslušné stanice značka „3>“. (12) PN je pro strojvedoucího pokynem k uvedení vlaku do pohybu ve všech případech, kdy příslušným návěstidlem je dovolena výprava vlaku (viz čl. 362). (13) Nařízená jízda podle rozhledových poměrů podle odst. (1) tohoto článku, platí od úrovně návěstidla s návěstí PN až: a) k následujícímu hlavnímu návěstidlu v obvodu dopravny […]; b) v případě, že ve směru jízdy není již v obvodu dopravny s kolejovým rozvětvením další hlavní návěstidlo, pak do úrovně žlutého označovacího pásu; c) při odjezdu na trať s AB (kromě AB bez oddílových návěstidel) musí strojvedoucí dodržet podmínky jízdy podle rozhledových poměrů až k prvnímu oddílovému návěstidlu AB; […]\n\nSŽ D1 čl. 361 odst. (4): V TJŘ musí být označeny značkou (symbol výpravky) stanice, ve kterých není výprava vlaků s přepravou cestujících, které stojí v prostoru pro výstup a nástup cestujících, dovolena návěstí hlavního návěstidla. […]", "distraktory": ["Vlak podle TJŘ projíždí a vjezd byl dovolen návěstí nenařizující zastavení, PN je proto výpravou; stanicí projede podle rozhledových poměrů nejvýše 30 km/h.", "Symbol výpravky v TJŘ stanice znamená, že PN není pro vlak s cestujícími výpravou; strojvedoucí zastaví a vyčká výpravy návěstí Odjezd nebo písemným rozkazem."], "jistota": "střední", "poznamka": "Klíčové je, že R 1391 v Liptákově podle TJŘ projíždí (ve sloupci 7 jen čas průjezdu 37, bez příjezdu/pobytu) a symbol výpravky v TJŘ se vztahuje jen na vlaky stojící v prostoru pro výstup a nástup (čl. 361 odst. 4). Výstraha je návěst dovolující jízdu, která nenařizuje zastavení ve stanici, proto platí čl. 362 odst. (2) písm. b) bod 1. Pokud by tvůrce otázky vykládal „Výstrahu“ jako návěst nařizující zastavení, byla by odpověď opačná (zastavit a vyčkat výpravy)."}, {"n": 23, "otazka": "Vlak s přepravou cestujících stojí ve stanici Nepomuk označené v TJŘ symbolem „výpravky“ v prostoru pro výstup a nástup cestujících. Cestové návěstidlo platné jen pro jednu kolej, na které tento vlak stojí, návěstí „Přivolávací návěst“. Je pro strojvedoucího návěst „Přivolávací návěst“ rozkazem k odjezdu?", "obrazky": ["img/q023_1.png"], "tema": "Výprava a odjezd", "predpis": "SŽ D1", "zdroje": [{"predpis": "SŽ D1", "clanek": "čl. 138 odst. (12)"}, {"predpis": "SŽ D1", "clanek": "čl. 361 odst. (4)"}, {"predpis": "SŽ D1", "clanek": "čl. 364 odst. (4) písm. c)"}], "odpoved": "Ne. Ve stanici se symbolem výpravky není výprava návěstí hlavního návěstidla dovolena; vlak smí do pohybu až po výpravě výpravčím, poté jede podle rozhledových poměrů.", "plne_zneni": "SŽ D1 čl. 138 odst. (12): PN je pro strojvedoucího pokynem k uvedení vlaku do pohybu ve všech případech, kdy příslušným návěstidlem je dovolena výprava vlaku (viz čl. 362). Návěst Stop značka ETCS a PN je pro strojvedoucího pokynem k uvedení vlaku do pohybu.\n\nSŽ D1 čl. 361 odst. (4): V TJŘ musí být označeny značkou (symbol výpravky) stanice, ve kterých není výprava vlaků s přepravou cestujících, které stojí v prostoru pro výstup a nástup cestujících, dovolena návěstí hlavního návěstidla. Takto se označí dotčené stanice v TJŘ všech vlaků s přepravou cestujících včetně vlaků, které v této stanici pravidelně projíždějí, zastavují jen z dopravních důvodů nebo jedou v době výluky dopravní služby výpravčího. […]\n\nSŽ D1 čl. 364 odst. (4): Výpravčí vypravuje návěstí Odjezd: […] c) vlaky s přepravou cestujících ve stanicích, kde není dovolena výprava těchto vlaků návěstí hlavního návěstidla, pokud stojí v prostoru pro výstup a nástup cestujících; […]\n\nSŽ D1 čl. 356 odst. (3): Strojvedoucí nesmí ve stanici: a) projet bez výpravy, b) uvést vlak do pohybu bez výpravy.", "distraktory": ["Ano. Cestové návěstidlo platné jen pro jednu kolej dovoluje výpravu návěstí hlavního návěstidla; strojvedoucí odjede podle rozhledových poměrů nejvýše 40 km/h.", "Ano, ale jen je-li vlak zpraven písemným rozkazem o neobsluhování cestového návěstidla; návěst Odjezd se ve stanici se symbolem výpravky u PN nedává."], "jistota": "vysoká", "poznamka": ""}, {"n": 24, "otazka": "Vlak s přepravou cestujících stojí ve stanici Světlá nad Sázavou, která nemá ve sloupci 2 TJŘ žádnou značku. Odjezdové návěstidlo platné jen pro kolej, na které tento vlak stojí, návěstí návěst „Přivolávací návěst“. Je tato návěst pro strojvedoucího rozkazem k odjezdu?", "obrazky": ["img/q024_1.png"], "tema": "Výprava a odjezd", "predpis": "SŽ D1", "zdroje": [{"predpis": "SŽ D1", "clanek": "čl. 138 odst. (12)"}, {"predpis": "SŽ D1", "clanek": "čl. 362 odst. (2) písm. a) bod 1., odst. (6) písm. a)"}, {"predpis": "SŽ D1", "clanek": "čl. 361 odst. (4)"}], "odpoved": "Ano. Stanice nemá symbol výpravky a návěstidlo platí jen pro jednu kolej, PN je proto pokynem k uvedení do pohybu; jede podle rozhledových poměrů nejvýše 40 km/h.", "plne_zneni": "SŽ D1 čl. 138 odst. (12): PN je pro strojvedoucího pokynem k uvedení vlaku do pohybu ve všech případech, kdy příslušným návěstidlem je dovolena výprava vlaku (viz čl. 362).\n\nSŽ D1 čl. 362 odst. (2): Výpravu vlaku návěstí hlavního návěstidla může výpravčí uskutečnit: a) u odjíždějícího vlaku jen z dopravní koleje, u které je: 1. Odjezdové, cestové nebo vložené návěstidlo platné jen pro jednu kolej. […] (6) Ve stanicích, kde je dovolena výprava vlaků z dopravní koleje návěstí hlavního návěstidla, se dále postupuje podle těchto ustanovení: a) vidí-li strojvedoucí, že hlavní návěstidlo platné pro dopravní kolej, na které stojí čelo vlaku, dovoluje jízdu vlaku […], uvede po provedení dopravcem předepsaných úkonů vlak do pohybu. […]\n\nSŽ D1 čl. 361 odst. (4): V TJŘ musí být označeny značkou (symbol výpravky) stanice, ve kterých není výprava vlaků s přepravou cestujících, které stojí v prostoru pro výstup a nástup cestujících, dovolena návěstí hlavního návěstidla. […]\n\nSŽ D1 čl. 138 odst. (1): Přivolávací návěst […] strojvedoucímu ostatních vlaků • dovoluje jízdu kolem návěstidla, u kterého nelze rozsvítit návěsti dovolující jízdu vlaku • nařizuje jízdu podle rozhledových poměrů […]", "distraktory": ["Ne. PN jen dovoluje jízdu kolem návěstidla, výpravou vlaku s cestujícími není; strojvedoucí vyčká výpravy návěstí Odjezd nebo pokynu výpravčího telekomunikačním zařízením.", "Ano, ale jen je-li vlak zpraven písemným rozkazem o jízdě na PN; bez zpravení vyčká návěsti Odjezd a poté odjede podle rozhledových poměrů nejvýše 30 km/h."], "jistota": "vysoká", "poznamka": ""}, {"n": 25, "otazka": "Vlak odjíždí ze stanice kolem cestového návěstidla s návěstí „Přivolávací návěst“. Na následujícím hlavním návěstidle je návěst dovolující jízdu. Pojede strojvedoucí podle rozhledových poměrů?", "obrazky": ["img/q025_1.png"], "tema": "Návěsti", "predpis": "SŽ D1", "zdroje": [{"predpis": "SŽ D1", "clanek": "čl. 138 odst. (13) písm. a)"}, {"predpis": "SŽ D1", "clanek": "čl. 138 odst. (1)"}], "odpoved": "Ano, ale jen od cestového návěstidla s PN k následujícímu hlavnímu návěstidlu v obvodu dopravny; od něj se řídí jeho návěstí a podle rozhledu již nejede.", "plne_zneni": "SŽ D1 čl. 138 odst. (13): Nařízená jízda podle rozhledových poměrů podle odst. (1) tohoto článku, platí od úrovně návěstidla s návěstí PN až: a) k následujícímu hlavnímu návěstidlu v obvodu dopravny nebo tam, kde hlavní návěstidlo není přímo u koleje k návěstidlu s návěstí Konec vlakové cesty; b) v případě, že ve směru jízdy není již v obvodu dopravny s kolejovým rozvětvením další hlavní návěstidlo, pak do úrovně žlutého označovacího pásu; c) při odjezdu na trať s AB (kromě AB bez oddílových návěstidel) musí strojvedoucí dodržet podmínky jízdy podle rozhledových poměrů až k prvnímu oddílovému návěstidlu AB; d) do místa zastavení před následujícím hlavním návěstidlem nebo návěstí Konec vlakové cesty. Je-li nutné i při odjezdu vlaku ze stanice dodržet podmínky jízdy podle rozhledových poměrů až k hlavnímu návěstidlu nebo návěsti Konec vlakové cesty, kde končila vlaková cesta při jízdě na příslušnou kolej, musí být tato povinnost strojvedoucímu nařízena písemným rozkazem.\n\nSŽ D1 čl. 138 odst. (1): Přivolávací návěst – přerušované bílé světlo […] strojvedoucímu ostatních vlaků • dovoluje jízdu kolem návěstidla, u kterého nelze rozsvítit návěsti dovolující jízdu vlaku • nařizuje jízdu podle rozhledových poměrů (viz odst. (6), (7) a (13) tohoto článku) […]", "distraktory": ["Ano, podle rozhledových poměrů pojede od cestového návěstidla s PN až do úrovně žlutého označovacího pásu, resp. k prvnímu oddílovému návěstidlu AB.", "Ne, jede už od cestového návěstidla s PN rychlostí podle návěsti následujícího hlavního návěstidla, nejvýše však 40 km/h v obvodu přilehlých výhybek."], "jistota": "vysoká", "poznamka": ""}];
